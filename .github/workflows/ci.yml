name: CI

"on":
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: mbologna/.github/.github/workflows/node-ci.yml@4b4747868503ac56c93161ab217f26708509b536 # main
    with:
      node_version: "20"
      package_manager: npm
      test_command: test
      build_command: bash build-extension.sh
      build_artifact_name: extension-build
      build_artifact_path: dist/*.zip
      build_artifact_retention_days: 30

  auto-release:
    if: github.event_name == 'schedule'
    # contents: push the tag; actions: dispatch this workflow on it, since a
    # tag pushed with GITHUB_TOKEN triggers no run of its own.
    permissions:
      contents: write
      actions: write
    uses: mbologna/.github/.github/workflows/auto-release.yml@4b4747868503ac56c93161ab217f26708509b536 # main
    with:
      strategy: commits
    secrets: inherit
